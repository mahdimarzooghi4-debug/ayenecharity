name: ayenecharity-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks:
      - backend

  object-storage:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: "us-east-1"
    volumes:
      - prod_object_storage_data:/data
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_API_HOST_PORT:-9300}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9301}:9001"
    mem_limit: 384m
    networks:
      - backend

  object-storage-init:
    image: ayenecharity-production-api:latest
    restart: "no"
    depends_on:
      - object-storage
    environment:
      S3_INTERNAL_ENDPOINT: http://object-storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["node", "apps/api/scripts/init-object-storage.mjs"]
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: "12"
      WEB_ORIGIN: ${WEB_ORIGIN}
      TRUST_PROXY_HOPS: "1"
      S3_ENDPOINT: ${API_ORIGIN}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_MEDIA_BASE_URL: ${API_ORIGIN}/${S3_BUCKET}
      MEDIA_SIGNED_URL_TTL_SECONDS: "300"
    extra_hosts:
      - "${API_HOST}:host-gateway"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3301}:3001"
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_ORIGIN}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${API_ORIGIN}/${S3_BUCKET}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      NEXT_PUBLIC_API_BASE_URL: ${API_ORIGIN}
      SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${API_ORIGIN}/${S3_BUCKET}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3300}:3000"
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

volumes:
  prod_postgres_data:
  prod_object_storage_data:

networks:
  backend:
    driver: bridge
