name: V1 Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_API_URL: https://api-stage.ayenecharity.ir
      STAGING_WEB_URL: https://stage.ayenecharity.ir

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging public endpoints
        run: |
          test -n "$STAGING_API_URL"
          test -n "$STAGING_WEB_URL"
          case "$STAGING_API_URL" in https://*) ;; *) exit 1 ;; esac
          case "$STAGING_WEB_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run staging smoke checks
        run: node scripts/smoke-stage.mjs

      - name: Release gate summary
        run: |
          echo "V1 staging public gate passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- API liveness/readiness: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database/object-storage readiness through API: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public/admin HTTP smoke: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Database backup/restore and migration status are intentionally host-local prerequisites because staging PostgreSQL is not exposed to GitHub-hosted runners." >> "$GITHUB_STEP_SUMMARY"
